server:
  port: 8083

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:}            # secreto: sin valor por defecto
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  sql:
    init:
      mode: always                       # ejecuta schema.sql (idempotente) al arrancar

# Secretos sin valor por defecto: si faltan, la app no arranca y dice cuál.
auth:
  jwt:
    secret: ${JWT_SECRET:}               # obligatorio, mínimo 32 caracteres; MISMO valor que el Gateway
    expires-in: ${JWT_EXPIRES_IN:1h}
    issuer: ${JWT_ISSUER:api-gateway-uptc}
    audience: ${JWT_AUDIENCE:sistema-academico}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}         # obligatoria, mínimo 8 caracteres (solo para crear el ADMIN inicial)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
